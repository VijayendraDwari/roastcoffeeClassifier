[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "coffee-roast-classifier"
version = "0.1.0"
description = "Reproducible educational CNN for coffee roast classification"
requires-python = ">=3.10,<3.13"
dependencies = ["tensorflow==2.16.2", "numpy>=1.23.5,<2", "Pillow>=10,<12", "scikit-learn>=1.3,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<9"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
